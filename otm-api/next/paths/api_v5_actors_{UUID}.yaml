get:
  responses:
    '200':
      description: Returned the entity with the provided UUID
      content:
        application/json:
          schema:
            $ref: ../components/schemas/actor.yaml
    '400':
      description: Client error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/clientError.yaml
    '404':
      description: ''
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/serverError.yaml
  summary: Get a specific Actor by its UUID
  parameters:
    - name: UUID
      in: path
      schema:
        type: string
        format: uuid
      description: The unique UUID of this Actor
      required: true
  tags:
    - Actor
  security:
    - BearerToken: []
delete:
  responses:
    '204':
      description: Deleted actor with the provided UUID
    '400':
      description: Client error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/clientError.yaml
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/serverError.yaml
  summary: Deletes a Actor
  parameters:
    - name: UUID
      in: path
      schema:
        type: string
        format: uuid
      description: The unique UUID of the Actor to be deleted
      required: true
  tags:
    - Actor
  security:
    - BearerToken: []
