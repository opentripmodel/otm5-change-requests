get:
  operationId: getTripByUuid
  responses:
    '200':
      description: Returned the entity with the provided UUID
      content:
        application/json:
          schema:
            $ref: ../components/schemas/entity/trip.yaml
    '400':
      description: Client error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/clientError.yaml
    '404':
      description: ''
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/serverError.yaml
  summary: Get a specific Trip by its UUID
  parameters:
    - name: UUID
      in: path
      schema:
        type: string
        format: uuid
      description: The unique UUID of this Trip
      required: true
  tags:
    - Trip
  security:
    - BearerToken: []
delete:
  operationId: deleteTripByUuid
  responses:
    '204':
      description: Deleted trip with the provided UUID
    '400':
      description: Client error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/clientError.yaml
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/serverError.yaml
  summary: Deletes a Trip
  parameters:
    - name: UUID
      in: path
      schema:
        type: string
        format: uuid
      description: The unique UUID of the Trip to be deleted
      required: true
  tags:
    - Trip
  security:
    - BearerToken: []
