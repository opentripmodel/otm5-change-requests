put:
  operationId: createActor
  responses:
    '200':
      description: The same entity
      content:
        application/json:
          schema:
            $ref: ../components/schemas/actor.yaml
    '400':
      description: Client error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/clientError.yaml
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/serverError.yaml
  summary: Adds a new Actor
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/actor.yaml
  tags:
    - Actor
  security:
    - BearerToken: []
