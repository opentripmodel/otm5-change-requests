get:
  operationId: getRouteByUuid
  responses:
    '200':
      description: Returned the entity with the provided UUID
      content:
        application/json:
          schema:
            $ref: ../components/schemas/entity/route.yaml
    '400':
      description: Client error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/clientError.yaml
    '404':
      description: ''
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/serverError.yaml
  summary: Get a specific Route by its UUID
  parameters:
    - name: UUID
      in: path
      schema:
        type: string
        format: uuid
      description: The unique UUID of this Route
      required: true
  tags:
    - Route
  security:
    - BearerToken: []
delete:
  operationId: deleteRouteByUuid
  responses:
    '204':
      description: Deleted route with the provided UUID
    '400':
      description: Client error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/clientError.yaml
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/serverError.yaml
  summary: Deletes a Route
  parameters:
    - name: UUID
      in: path
      schema:
        type: string
        format: uuid
      description: The unique UUID of the Route to be deleted
      required: true
  tags:
    - Route
  security:
    - BearerToken: []
