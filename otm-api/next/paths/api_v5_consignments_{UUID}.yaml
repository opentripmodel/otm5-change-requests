get:
  operationId: getConsignmentByUuid
  responses:
    '200':
      description: Returned the entity with the provided UUID
      content:
        application/json:
          schema:
            $ref: ../components/schemas/consignment.yaml
    '400':
      description: Client error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/clientError.yaml
    '404':
      description: ''
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/serverError.yaml
  summary: Get a specific Consignment by its UUID
  parameters:
    - name: UUID
      in: path
      schema:
        type: string
        format: uuid
      description: The unique UUID of this Consignment
      required: true
  tags:
    - Consignment
  security:
    - BearerToken: []
delete:
  operationId: deleteConsignmentByUuid
  responses:
    '204':
      description: Deleted consignment with the provided UUID
    '400':
      description: Client error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/clientError.yaml
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/serverError.yaml
  summary: Deletes a Consignment
  parameters:
    - name: UUID
      in: path
      schema:
        type: string
        format: uuid
      description: The unique UUID of the Consignment to be deleted
      required: true
  tags:
    - Consignment
  security:
    - BearerToken: []
