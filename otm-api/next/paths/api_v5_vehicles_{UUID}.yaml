get:
  operationId: getVehicleByUuid
  responses:
    '200':
      description: Returned the entity with the provided UUID
      content:
        application/json:
          schema:
            $ref: ../components/schemas/entity/vehicle.yaml
    '400':
      description: Client error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/clientError.yaml
    '404':
      description: ''
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/serverError.yaml
  summary: Get a specific Vehicle by its UUID
  parameters:
    - name: UUID
      in: path
      schema:
        type: string
        format: uuid
      description: The unique UUID of this Vehicle
      required: true
  tags:
    - Vehicle
  security:
    - BearerToken: []
delete:
  operationId: deleteVehicleByUuid
  responses:
    '204':
      description: Deleted vehicle with the provided UUID
    '400':
      description: Client error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/clientError.yaml
    '500':
      description: Server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error/serverError.yaml
  summary: Deletes a Vehicle
  parameters:
    - name: UUID
      in: path
      schema:
        type: string
        format: uuid
      description: The unique UUID of the Vehicle to be deleted
      required: true
  tags:
    - Vehicle
  security:
    - BearerToken: []
