required:
  - entityType
oneOf:
  # Core entities
  - $ref: ./entity/trip-with-type.yaml
  - $ref: ./location-with-type.yaml
  - $ref: ./entity/vehicle.yaml
  - $ref: ./actor.yaml
  - $ref: ./transportOrder.yaml
  - $ref: ./consignment.yaml
  - $ref: ./entity/goods.yaml
  - $ref: ./entity/route-with-type.yaml

  # Miscellaneous
  - $ref: ./entity/document-with-type.yaml
  - $ref: ./entity/sensor-with-type.yaml
  - $ref: ./entity/constraint-with-type.yaml
  
  # Actions
  - $ref: ./entity/load-in-events.yaml
  - $ref: ./entity/unload-in-events.yaml
  - $ref: ./entity/stop-in-events.yaml
  - $ref: ./entity/move-in-events.yaml
  - $ref: ./entity/handover-in-events.yaml
  - $ref: ./entity/attach-in-events.yaml
  - $ref: ./entity/detach-in-events.yaml
  - $ref: ./entity/refuel-in-events.yaml
  - $ref: ./entity/break-in-events.yaml
  - $ref: ./entity/wait-in-events.yaml
  - $ref: ./entity/generic-in-events.yaml
discriminator:
  propertyName: entityType
  mapping:
    trip: ./entity/trip-with-type.yaml
    location: ./location-with-type.yaml
    vehicle: ./entity/vehicle.yaml
    actor: ./actor.yaml
    transportOrder: ./transportOrder.yaml
    consignment: ./consignment.yaml
    goods: ./entity/goods.yaml
    route: ./entity/route-with-type.yaml

    document: ./entity/document-with-type.yaml
    sensor: ./entity/sensor-with-type.yaml
    constraint: ./entity/constraint-with-type.yaml
    
    load: ./entity/load-in-events.yaml
    unload: ./entity/unload-in-events.yaml
    stop: ./entity/stop-in-events.yaml
    move: ./entity/move-in-events.yaml
    handOver: ./entity/handover-in-events.yaml
    attachTransportEquipment: ./entity/attach-in-events.yaml
    detachTransportEquipment: ./entity/detach-in-events.yaml
    refuel: ./entity/refuel-in-events.yaml
    break: ./entity/break-in-events.yaml
    wait: ./entity/wait-in-events.yaml
    genericAction: ./entity/generic-in-events.yaml
