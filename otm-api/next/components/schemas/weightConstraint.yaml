type: object
properties:
  type:
    example: weightConstraint
    type: string
    enum:
      - weightConstraint
  constraintType:
    description: |
      The type of weight constraint. Available types are:
        - `maximum`: All weights below and including the maximum value are allowed.
        - `minimum`: All weights above and including the minimum value are allowed.
        - `range`: All weights in between and including the minimum and maximum values are allowed.
    type: string
    enum:
      - maximum
      - minimum
      - range
  maximum:
    description: Maximum weight allowed.
    type: object
    properties:
      value:
        description: Value in the given unit.
        type: number
        format: double
      unit:
        $ref: ./uom.yaml
    required:
      - value
      - unit
  minimum:
    description: Minimum weight allowed.
    type: object
    properties:
      value:
        description: Value in the given unit.
        type: number
        format: double
      unit:
        $ref: ./uom.yaml
    required:
      - value
      - unit
  description:
    description: >-
      The description for this (sub)-constraints. Can be used to make combined
      constraints using **and**, **or** and **not** easier to process.
    type: string
required:
  - type
  - constraintType
