type: object
properties:
  type:
    example: speedConstraint
    type: string
    enum:
      - speedConstraint
  constraintType:
    description: |
      The type of speed constraint. Available types are:
        - `maximum`: All speeds below and including the maximum value are allowed.
        - `minimum`: All speeds above and including the minimum value are allowed.
    type: string
    enum:
      - maximum
      - minimum
      - range
  maximum:
    description: Maximum speed allowed.
    type: object
    properties:
      value:
        description: Value in the given unit.
        type: number
        format: double
      unit:
        $ref: ./uom.yaml
    required:
      - value
      - unit
  minimum:
    description: Minimum speed allowed.
    type: object
    properties:
      value:
        description: Value in the given unit.
        type: number
        format: double
      unit:
        $ref: ./uom.yaml
    required:
      - value
      - unit
  description:
    description: >-
      The description for this (sub)-constraints. Can be used to make combined
      constraints using **and**, **or** and **not** easier to process.
    type: string
required:
  - type
  - constraintType
