type: object
properties:
  type:
    example: valueBoundConstraint
    type: string
    enum:
      - valueBoundConstraint
  valueType:
    type: string
    enum:
      - height
      - length
      - width
      - weight
      - speed
      - temperature
  constraintType:
    description: >
      The upper and lower bounds the value bound constraint required. Available
      options are:
        - `maximum`: All sensor values below and including the maximum value are allowed.
        - `minimum`: All sensor values above and including the minimum value are allowed.
    type: string
    enum:
      - maximum
      - minimum
      - range
  maximum:
    description: Maximum value allowed.
    type: object
    properties:
      value:
        description: Value in the given unit.
        type: number
        format: double
      unit:
        $ref: ./uom.yaml
    required:
      - value
      - unit
  minimum:
    description: Minimum value allowed.
    type: object
    properties:
      value:
        description: Value in the given unit.
        type: number
        format: double
      unit:
        $ref: ./uom.yaml
    required:
      - value
      - unit
  description:
    description: >-
      The description for this (sub)-constraints. Can be used to make combined
      constraints using **and**, **or** and **not** easier to process.
    type: string
required:
  - type
  - valueType
  - constraintType
